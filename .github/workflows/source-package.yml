name: AETHRA Source Package

on:
  push:
  workflow_dispatch:

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Package exact source revision
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -p source-package
          git archive --format=zip --output="source-package/AETHRA-Wildbound-Source-${SOURCE_SHA:0:8}.zip" "$SOURCE_SHA"
          printf 'AETHRA source package\nSource revision: %s\n' "$SOURCE_SHA" > source-package/SOURCE-REVISION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AETHRA-Wildbound-Source-LATEST
          path: source-package/*
