name: AETHRA Final Windows Release
on:
  workflow_dispatch:
  push:
    branches:
      - fix/aethra-ui-auth-performance
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate final Windows EXE
        run: |
          .\build_windows_auto.ps1 -Output "build/AETHRA-Wildbound.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows build script failed" }
          if (-not (Test-Path "build/AETHRA-Wildbound.exe")) { throw "Final EXE missing" }
          $size=(Get-Item "build/AETHRA-Wildbound.exe").Length
          if ($size -lt 1000000) { throw "EXE unexpectedly small: $size bytes" }
      - name: Final EXE startup smoke
        run: |
          $p=Start-Process ".\build\AETHRA-Wildbound.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Final EXE exited during startup" }
          Stop-Process -Id $p.Id -Force
      - name: Optional installer
        continue-on-error: true
        run: |
          choco install innosetup --no-progress -y
          $candidates=@(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\lib\innosetup\tools\ISCC.exe"
          )
          $iscc=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) {
            & $iscc "installer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          } else {
            Write-Warning "Inno Setup compiler not found; EXE release remains valid."
          }
      - name: Hashes
        run: |
          $game=(Get-FileHash "build/AETHRA-Wildbound.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("AETHRA FINAL WINDOWS EXE","Game SHA256: $game","Final EXE startup smoke: PASS") | Set-Content FINAL-WINDOWS-VERIFICATION.md
          if (Test-Path "build/AETHRA-Wildbound-Setup.exe") {
            $setup=(Get-FileHash "build/AETHRA-Wildbound-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content FINAL-WINDOWS-VERIFICATION.md "Installer SHA256: $setup"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AETHRA-Wildbound-FINAL-Windows-x64
          if-no-files-found: error
          path: |
            build/AETHRA-Wildbound.exe
            build/AETHRA-Wildbound-Setup.exe
            FINAL-WINDOWS-VERIFICATION.md
