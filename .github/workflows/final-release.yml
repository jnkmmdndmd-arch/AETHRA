name: AETHRA Final Windows Release
on:
  workflow_dispatch:
  push:
    branches:
      - fix/aethra-ui-auth-performance
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe")) { throw "Inno Setup not found" }
      - name: Build and validate Windows EXE
        run: |
          .\build_windows_auto.ps1 -Output "build/AETHRA-Wildbound.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows build script failed" }
          if (-not (Test-Path "build/AETHRA-Wildbound.exe")) { throw "Final EXE missing" }
      - name: Build installer
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (-not (Test-Path "build/AETHRA-Wildbound-Setup.exe")) { throw "Installer missing" }
      - name: Verify clean installation
        run: |
          $dir = "$env:RUNNER_TEMP\AETHRA-Installed"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $p = Start-Process (Resolve-Path "build/AETHRA-Wildbound-Setup.exe") -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$dir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer returned $($p.ExitCode)" }
          if (-not (Test-Path "$dir\AETHRA-Wildbound.exe")) { throw "Installed game EXE missing" }
          $desktop = [Environment]::GetFolderPath("Desktop")
          if (-not (Get-ChildItem $desktop -Filter "AETHRA*" -ErrorAction SilentlyContinue | Where-Object {$_.Extension -eq ".lnk"})) { throw "Desktop shortcut missing" }
      - name: Installed EXE startup smoke
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\AETHRA-Installed\AETHRA-Wildbound.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Installed EXE exited during startup" }
          Stop-Process -Id $p.Id -Force
      - name: Final hashes
        run: |
          $game=(Get-FileHash "build/AETHRA-Wildbound.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $setup=(Get-FileHash "build/AETHRA-Wildbound-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("AETHRA FINAL WINDOWS RELEASE","Game SHA256: $game","Installer SHA256: $setup","Installed EXE startup: PASS","Interactive gameplay/multiplayer: requires manual GUI verification") | Set-Content FINAL-WINDOWS-VERIFICATION.md
      - uses: actions/upload-artifact@v4
        with:
          name: AETHRA-Wildbound-FINAL-Windows-x64
          if-no-files-found: error
          path: |
            build/AETHRA-Wildbound.exe
            build/AETHRA-Wildbound-Setup.exe
            FINAL-WINDOWS-VERIFICATION.md
