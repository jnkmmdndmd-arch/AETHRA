      - name: Install Godot 4.7.2
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "godot-4.7.2"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile (Join-Path $root "godot.zip")
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -OutFile (Join-Path $root "templates.tpz")
          Expand-Archive -Path (Join-Path $root "godot.zip") -DestinationPath $root -Force
          Expand-Archive -Path (Join-Path $root "templates.tpz") -DestinationPath $root -Force
          $godotExe = Get-ChildItem -Path $root -Recurse -Filter "Godot*.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $godotExe) { throw "Godot executable was not found." }
          $templatesDir = Join-Path $env:APPDATA "Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $templatesDir | Out-Null
          foreach ($tplRoot in @((Join-Path $root "templates"),(Join-Path $root "export_templates"))) {
            if (Test-Path $tplRoot) { Get-ChildItem $tplRoot -Force | Copy-Item -Destination $templatesDir -Recurse -Force }
          }
          $env:PATH = (Split-Path -Parent $godotExe) + ";" + $env:PATH
          & $godotExe --version

      - name: Godot parse/editor gates
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot-4.7.2" -Recurse -Filter "Godot*.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $godot --headless --path . --editor --quit
          if ($LASTEXITCODE -ne 0) { throw "Editor validation failed." }
          & $godot --headless --path . --script "res://tests/parse_all_scripts.gd"
          if ($LASTEXITCODE -ne 0) { throw "GDScript parse gate failed." }

      - name: Fresh graphical runtime proof
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot-4.7.2" -Recurse -Filter "Godot*.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (Test-Path "runtime-proof") { Remove-Item -Recurse -Force "runtime-proof" }
          $stdout = Join-Path $env:RUNNER_TEMP "investigation-visual.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "investigation-visual.stderr.log"
          $args = @("--path", ".", "--resolution", "1280x720", "--rendering-method", "gl_compatibility", "--script", "res://tests/runtime_visual_smoke.gd")
          $process = Start-Process -FilePath $godot -ArgumentList $args -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "Visual runtime timed out."
          }
          Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Visual runtime failed: $($process.ExitCode)" }
          if (-not (Test-Path "runtime-proof/runtime-menu-proof.png")) { throw "Missing menu screenshot." }
          if (-not (Test-Path "runtime-proof/runtime-world-proof.png")) { throw "Missing world screenshot." }

      - name: Fresh Windows export
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot-4.7.2" -Recurse -Filter "Godot*.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $godot --headless --path . --export-release "Windows Desktop" "build/AETHRA-Wildbound-Investigation.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed." }
          $sha = (Get-FileHash "build/AETHRA-Wildbound-Investigation.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  AETHRA-Wildbound-Investigation.exe" | Out-File -Encoding ascii build/AETHRA-Wildbound-Investigation.sha256

      - name: Actual EXE startup smoke
        shell: pwsh
        run: |
          $exe = "build/AETHRA-Wildbound-Investigation.exe"
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Normal
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            throw "EXE exited unexpectedly with code $($proc.ExitCode)."
          }
          $proc | Stop-Process -Force
          "EXE_PROCESS_START=PASS" | Out-File -Encoding ascii runtime-proof/exe-start.txt

      - name: Upload fresh proof
        uses: actions/upload-artifact@v4
        with:
          name: AETHRA-Investigation-Proof-20260923
          path: |
            runtime-proof/runtime-menu-proof.png
            runtime-proof/runtime-world-proof.png
            runtime-proof/boot_log.txt
            runtime-proof/exe-start.txt
            build/AETHRA-Wildbound-Investigation.exe
            build/AETHRA-Wildbound-Investigation.sha256
            build/commit.sha
