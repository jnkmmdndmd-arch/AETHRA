name: apply-local-upgrade
on:
  push:
    branches:
      - fix/aethra-ui-auth-performance
permissions:
  contents: write
jobs:
  apply:
    if: ${{ hashFiles('upgrade.patch.ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply pending patch
        shell: bash
        run: |
          set -euo pipefail
          cat upgrade.patch.b64.part_* > upgrade.patch.b64
          sha256sum upgrade.patch.b64
          base64 -d upgrade.patch.b64 > upgrade.patch.gz
          python3 - <<'PY'
          import gzip
          with gzip.open("upgrade.patch.gz","rb") as src, open("upgrade.patch","wb") as dst:
              dst.write(src.read())
          PY
          git apply --whitespace=fix upgrade.patch
          rm -f upgrade.patch.ready upgrade.patch.b64 upgrade.patch.gz upgrade.patch
          rm -f upgrade.patch.b64.part_*
          rm -f .github/workflows/apply-local-upgrade.yml
          git config user.name "AETHRA Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: complete systems hardening and windows installer"
          git push origin HEAD:fix/aethra-ui-auth-performance
